[project]
name = "rating_service"
version = "0.1.0"
description = "Rating service for mixtura ranker - implements Bayesian rating system with open/closed rating mapping"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faststream[rabbit]>=0.6.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.12.0",
    "redis>=7.0.0",
    "alembic>=1.17.0",
    "openskill>=6.2.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-dotenv>=0.5.2",
    "testcontainers>=4.14.2",
]
